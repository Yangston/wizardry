name: Wizardry
options:
  minimumXcodeGenVersion: 2.42.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    WIZARDRY_BUNDLE_ID: com.yangston.wizardry
    CODE_SIGN_STYLE: Automatic
targets:
  Wizardry:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: Sources/GestureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIZARDRY_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Wizardry
        WKApplication: true
        WKWatchOnly: true
        NSMotionUsageDescription: Wizardry uses wrist motion to recognize deliberate control gestures.
        NSLocalNetworkUsageDescription: Wizardry sends commands to your computer on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
  WizardryContainer:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIZARDRY_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: NO
    info:
      path: Generated/Container-Info.plist
      properties:
        CFBundleDisplayName: Wizardry
        ITSWatchOnlyContainer: true
        LSApplicationLaunchProhibited: true
        NSMotionUsageDescription: Wizardry uses wrist motion to recognize deliberate control gestures.
        NSLocalNetworkUsageDescription: Wizardry sends commands to your computer on your local network.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: Wizardry
        embed: true
schemes:
  Wizardry:
    build:
      targets:
        Wizardry: all
  WizardryDistribution:
    build:
      targets:
        WizardryContainer: all
    archive:
      config: Release
