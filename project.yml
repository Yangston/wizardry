name: Wizardry
options:
  minimumXcodeGenVersion: 2.42.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SPOTIFY_CLIENT_ID: ""
    WIZARDRY_BUNDLE_ID: com.yangston.wizardry
    CODE_SIGN_STYLE: Automatic
targets:
  Wizardry:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: Sources/GestureCore
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIZARDRY_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Wizardry
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(WIZARDRY_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        NSMotionUsageDescription: Wizardry uses wrist motion to recognize deliberate control gestures.
        NSLocalNetworkUsageDescription: Wizardry sends commands to your computer on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
  WizardryContainer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhoneApp
      - path: Shared
      - path: Sources/GestureCore
    entitlements:
      path: Generated/Phone.entitlements
      properties:
        com.apple.developer.homekit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIZARDRY_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: NO
    info:
      path: Generated/Container-Info.plist
      properties:
        CFBundleDisplayName: Wizardry
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHomeKitUsageDescription: Wizardry controls the lights, plugs, and scenes you select with your watch gestures.
        NSAppleMusicUsageDescription: Wizardry sends your selected playback commands to Apple Music.
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.yangston.wizardry.spotify
            CFBundleURLSchemes: [wizardry-spotify]
        NSMotionUsageDescription: Wizardry uses wrist motion to recognize deliberate control gestures.
        NSLocalNetworkUsageDescription: Wizardry sends commands to your computer on your local network.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: Wizardry
        embed: true
  WizardryPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [PhoneUITests]
    dependencies:
      - target: WizardryContainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIZARDRY_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WizardryContainer
schemes:
  WizardryPhone:
    build:
      targets:
        WizardryContainer: all
        WizardryPhoneUITests: [test]
    test:
      targets: [WizardryPhoneUITests]
  Wizardry:
    build:
      targets:
        Wizardry: all
  WizardryDistribution:
    build:
      targets:
        WizardryContainer: all
    archive:
      config: Release
