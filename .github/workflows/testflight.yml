name: Upload to TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require successful unsigned build and tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release.py
  distribute:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    environment: testflight
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.yangston.wizardry' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple configuration
        run: python3 scripts/check_signing.py
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          brew install xcodegen
          python -m pip install codemagic-cli-tools==0.62.0
      - name: Test gesture logic and generate project
        run: |
          swift test
          python scripts/configure_project.py
          xcodegen generate
      - name: Fetch signing assets for both targets
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --strict-match-identifier
          app-store-connect fetch-signing-files "$BUNDLE_ID.watchkitapp" --type IOS_APP_STORE --create --strict-match-identifier
          keychain add-certificates
          xcode-project use-profiles --project Wizardry.xcodeproj
      - name: Archive and export
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Wizardry.xcodeproj -scheme WizardryDistribution \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Wizardry.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" WIZARDRY_BUNDLE_ID="$BUNDLE_ID" \
            SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive \
            2>&1 | tee build/archive.log
          python scripts/check_archive.py build/Wizardry.xcarchive
          xcodebuild -exportArchive -archivePath build/Wizardry.xcarchive \
            -exportPath build/export -exportOptionsPlist "$HOME/export_options.plist"
      - name: Upload for internal testing
        run: |
          app-store-connect publish --path "build/export/*.ipa"
          echo "Uploaded. After Apple processing, assign the build to your internal group in App Store Connect." >> "$GITHUB_STEP_SUMMARY"
      - name: Save non-secret build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-logs
          path: build/*.log
          if-no-files-found: ignore
