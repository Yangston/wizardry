name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  watch:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install project generator
        run: brew install xcodegen
      - name: Test gesture state machine
        run: swift test
      - name: Generate project
        run: xcodegen generate
      - name: Build watch simulator app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Wizardry.xcodeproj -scheme Wizardry \
            -configuration Debug -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build/watch-build.log
      - name: Validate distribution packaging without signing
        run: |
          set -o pipefail
          xcodebuild -project Wizardry.xcodeproj -scheme WizardryDistribution \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Wizardry.xcarchive CODE_SIGNING_ALLOWED=NO archive \
            2>&1 | tee build/archive.log
          python3 scripts/check_archive.py build/Wizardry.xcarchive
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
  receiver:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s receiver -v
      - run: python -m unittest discover -s scripts/tests -v
